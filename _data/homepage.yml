publications:
- id: opendepth
  category: vision
  category_label:
    en: Depth estimation
    zh: 深度估计
  venue: ACM Multimedia 2026 · CCF-A
  title: 'OpenDepth: Repurposing Image Editing Priors for Robust Open-World Monocular Depth Estimation'
  authors: <strong>Mengke Zhang</strong>, Tianyi Yang, Xinzhuo Li, Anlong Ming
  primary_url: https://arxiv.org/abs/2610.17610
  image: /images/pub_opendepth.png
  alt:
    en: OpenDepth framework for robust monocular depth estimation
    zh: OpenDepth 鲁棒单目深度估计框架
  summary:
    en: Structure-preserving image editing priors for open-world depth estimation. Shallow feature alignment and
      RGB latent reconstruction disentangle geometry from environmental appearance changes.
    zh: 利用图像编辑先验的结构保持能力，通过浅层特征对齐与 RGB 隐空间重建解耦几何与环境外观变化，实现开放世界中的鲁棒单目深度估计。
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2610.17610
  - label: Code
    url: https://github.com/zmkshakespar/OpenDepth
  - label: Project
    url: https://zmkshakespar.github.io/OpenDepth/
  - label: PDF
    url: https://arxiv.org/pdf/2610.17610
- id: acr-net
  category: audio
  category_label:
    en: Audio & multimodal learning
    zh: 音频与多模态学习
  venue: Interspeech 2026 · CCF-B / CORE-A
  title: 'ACR-Net: Mitigating Semantic Dominance via Contrastive Acoustic-Semantic Decoupling'
  authors: <strong>Mengke Zhang*</strong>, Yanda Shao*, Tianhe Wu*, Kai Feng
  primary_url: https://arxiv.org/abs/2610.20114
  image: /images/pub_acrnet.png
  alt:
    en: ACR-Net acoustic-semantic contrastive decoupling architecture
    zh: ACR-Net 声学与语义对比解耦架构
  summary:
    en: Resolving conflicts between what is said and how it sounds. ACR-Net decouples acoustic and semantic representations,
      alongside the ASPIRE adversarial benchmark and SOP/LDD metrics.
    zh: 针对语音情感识别与音频大模型中的语义主导问题，解耦相互冲突的声学与语义表征，并提出 ASPIRE 对抗基准及 SOP/LDD 评价指标。
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2610.20114
  - label: Code
    url: https://github.com/zmkshakespar/ACR-Net
    note:
      en: Official repository; implementation release pending.
      zh: 官方代码仓库；实现待发布。
  - label: PDF
    url: /files/ACR-Net_Interspeech2026.pdf
- id: mamba-watermark
  category: audio
  category_label:
    en: Speech security
    zh: 语音安全
  venue: Interspeech 2026 · CCF-B / CORE-A
  title: 'Phoneme-Aware Mamba Watermark: An Active Defense System Against Purified Speech Deepfakes'
  authors: Yanda Shao*, <strong>Mengke Zhang*</strong>, Zhixin Lin*, Tianyi Yang
  primary_url: /files/Phoneme-Aware-Mamba-Watermark_Interspeech2026.pdf
  image: /images/pub_mamba_watermark.png
  alt:
    en: Phoneme-aware Mamba watermark embedding and detection framework
    zh: 音素感知 Mamba 语音水印嵌入与检测框架
  summary:
    en: A phoneme-guided speech watermark built on bidirectional Mamba. Coupling watermarks with speech semantics
      enables low-latency source tracing against diffusion-based purification attacks.
    zh: 基于双向 Mamba 的音素感知主动水印，将水印与语音语义耦合，抵抗扩散净化攻击，实现低延迟的语音溯源。
  links:
  - label: PDF
    url: /files/Phoneme-Aware-Mamba-Watermark_Interspeech2026.pdf
  - label: Code
    url: https://github.com/Silence-ai423/phoneme-aware-mamba-watermark
- id: dualmoe
  category: vision
  category_label:
    en: Image restoration
    zh: 图像复原
  venue: ICASSP 2026 · CCF-B / CORE-A
  title: Learning Dual Mixture-of-Experts Models for Unified Image Deraining
  authors: Tianyi Yang*, <strong>Mengke Zhang*</strong>, Tianshuo Chen
  primary_url: /files/DualMoE_Unified-Image-Deraining_ICASSP2026.pdf
  image: /images/pub_dualmoe.png
  alt:
    en: DualMoE unified image deraining model and Hybrid-Rain10K benchmark
    zh: DualMoE 统一图像去雨模型与 Hybrid-Rain10K 基准
  summary:
    en: A dual Mixture-of-Experts model for rain streaks, raindrops, and rain accumulation. Soft-MoE degradation
      modeling and high-frequency-guided Hard-MoE routing unify image deraining on Hybrid-Rain10K.
    zh: 面向雨线、雨滴与雨幕的统一图像去雨：结合 Soft-MoE 退化建模与高频引导的 Hard-MoE 路由，并构建 Hybrid-Rain10K 基准。
  links:
  - label: PDF
    url: /files/DualMoE_Unified-Image-Deraining_ICASSP2026.pdf
